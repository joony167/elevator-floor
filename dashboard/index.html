<!doctype html><html lang=ko><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>UT-14 — 엘리베이터 정차 대시보드</title>
<style>
:root{--bg:#0e1116;--card:#161b22;--line:#262d36;--fg:#e6edf3;--dim:#8b949e;
      --a:#58a6ff;--b:#f0883e;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--bg);color:var(--fg);
     font:14px/1.6 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
h1{font-size:19px;margin:0 0 4px}
h2{font-size:15px;margin:22px 0 8px;color:var(--a)}
.sub{color:var(--dim);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:12px}
.drop{border:2px dashed var(--line);border-radius:9px;padding:30px;text-align:center;color:var(--dim);cursor:pointer}
.drop.on{border-color:var(--a);color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.2}
.kpi .l{color:var(--dim);font-size:12px}
.kpi .n{color:var(--dim);font-size:11px;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 7px;text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:600}
.bad{color:var(--bad)}.warn{color:var(--warn)}.ok{color:var(--ok)}
.flag{padding:9px 11px;border-radius:7px;margin-bottom:8px;font-size:13px}
.f-bad{background:#3d1418;border:1px solid var(--bad)}
.f-warn{background:#3a2d0c;border:1px solid var(--warn)}
.f-ok{background:#0f2e18;border:1px solid var(--ok)}
svg{width:100%;height:auto;display:block}
.mut{color:var(--dim);font-size:12px}
code{background:#0b0f14;padding:1px 5px;border-radius:4px;font-size:12px}
.hide{display:none}
</style></head><body>

<h1>UT-14 — 엘리베이터 정차 대시보드</h1>
<div class=sub><code>door.csv</code> (UT-09b 독립 계측기) 를 넣으면 분석한다. 파일은 브라우저 밖으로 나가지 않는다.</div>

<div class=card>
  <div class=drop id=drop>여기에 <b>door.csv</b> 를 끌어다 놓거나 클릭해서 고르기
    <input type=file id=file class=hide accept=".csv,.txt,.xlsx">
  </div>
  <!-- 빈 화면으로는 이 대시보드가 무엇을 하는지 보여줄 수 없다. 링크를 처음 연
       사람에게는 실측 데이터가 이미 그려져 있어야 한다. 단, 무엇을 보고 있는지
       화면이 스스로 말해야 한다 — 그래서 위에 배지를 띄운다. -->
  <div id=samplebar style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
    <span class=mut style="margin-right:2px">예제:</span>
  </div>
</div>

<div id=samplenote class="card hide" style="border-color:var(--warn);background:#241c08">
  <b id=snTitle></b> <span class=mut id=snDesc></span>
</div>

<div id=out class=hide>

  <div id=flags></div>

  <h2>측정 조건</h2>
  <div class=card><table id=cond></table></div>

  <h2>핵심 지표</h2>
  <div class=grid id=kpi></div>

  <h2>개방 시간 분포</h2>
  <div class=card>
    <div id=hist></div>
    <div class=mut id=histnote></div>
  </div>

  <h2>효과 분석</h2>
  <div class=card id=effect></div>

  <h2>시간대별</h2>
  <div class=card id=byhour></div>

  <h2>데이터 품질</h2>
  <div class=card><table id=qual></table></div>

  <h2>정차 목록</h2>
  <div class=card style="max-height:420px;overflow:auto"><table id=rows></table></div>

</div>

<script>
// ── 파일 읽기 ───────────────────────────────────────────────
var drop=document.getElementById('drop'), file=document.getElementById('file');
drop.onclick=function(){file.click()};
drop.ondragover=function(e){e.preventDefault();drop.classList.add('on')};
drop.ondragleave=function(){drop.classList.remove('on')};
drop.ondrop=function(e){e.preventDefault();drop.classList.remove('on');take(e.dataTransfer.files[0])};
file.onchange=function(){take(file.files[0])};

function take(f){
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var t=r.result;
    // 폰에서 엑셀로 열어 보내면 xlsx(zip) 로 바뀌어 온다. 그건 못 읽는다.
    if(t.slice(0,2)==='PK'){
      alert('이 파일은 CSV 가 아니라 XLSX 입니다.\n\n폰에서 /log.csv 를 "엑셀로 열기" 하지 말고\n다운로드한 원본 파일을 그대로 주세요.');
      return;
    }
    parse(t);
  };
  r.readAsText(f);
}

// ── 파싱 ────────────────────────────────────────────────────
// door.csv 는 # 로 시작하는 마커 줄이 섞여 있다.
//   # boot=3 reset=USB th=726 grace=2000 deb=3 cmed=16
//   # epoch ms=... at=...
//   # clear ...
var D=null;
function parse(text){
  var lines=text.split(/\r?\n/), head=null, rows=[], markers=[], cur={};
  for(var i=0;i<lines.length;i++){
    var L=lines[i].trim(); if(!L)continue;
    if(L[0]==='#'){
      var m={};
      L.slice(1).trim().split(/\s+/).forEach(function(kv,j){
        var p=kv.split('='); if(p.length===2)m[p[0]]=p[1]; else if(j===0)m.kind=kv;
      });
      markers.push(m);
      if(m.boot!==undefined)cur={boot:+m.boot,reset:m.reset,th:+m.th,grace:+m.grace,deb:+m.deb,
                                 lastep:m.lastep?+m.lastep:0,base:0,est:false};
      if(m.th!==undefined&&cur)cur.th=+m.th;
      // # epoch ms=<unix> at=<millis>  →  이 부팅 구간의 기준시각 (정확)
      if(m.kind==='epoch'&&m.ms&&m.at!==undefined&&cur){cur.base=+m.ms-(+m.at);cur.est=false}
      continue;
    }
    var c=L.split(',');
    if(!head){ if(isNaN(+c[0])){head=c;continue;} head=['stop','t_open','open_ms','gap_ms','reopen','d_cmed','d_omin','n_dip','fault']; }
    var o={_boot:cur.boot||0,_th:cur.th||0,_grace:cur.grace||0,_deb:cur.deb||0,
           _reset:cur.reset||'',_lastep:cur.lastep||0,_est:false};
    for(var k=0;k<head.length;k++){
      var v=c[k]; o[head[k]] = (v===undefined||v==='') ? null : (isNaN(+v)?v:+v);
    }
    if(o.stop===null)continue;
    if(!o.epoch && cur.base) o.epoch = cur.base + o.t_open;   // 같은 부팅 내 주입분
    rows.push(o);
  }
  restoreTime(rows);
  D={rows:rows,markers:markers,head:head};
  render();
}

// ── 리셋 구간 시각 복원 ─────────────────────────────────────
// 보드에 RTC 가 없다. 리셋되면 millis() 가 0 으로 돌아가고 기준시각이 날아간다.
// 펌웨어는 추정하지 않고 "마지막으로 알던 시각(lastep)" 만 부팅 마커에 남긴다.
// 복원은 여기서 한다. 그리고 복원한 값은 반드시 추정치로 표시한다.
//
//   reset != POWERON  → 전원은 안 끊겼다. 재부팅 1초 내외 → 거의 정확
//   reset == POWERON  → 얼마나 꺼져 있었는지 모른다 → 하한만 안다. 복원 안 함
function restoreTime(rows){
  var byBoot={};
  rows.forEach(function(r){(byBoot[r._boot]=byBoot[r._boot]||[]).push(r)});
  Object.keys(byBoot).forEach(function(b){
    var g=byBoot[b], m=g[0];
    if(g.some(function(r){return r.epoch}))return;      // 이미 실측 epoch 가 있다
    if(!m._lastep) return;                              // 단서 없음
    if(m._reset==='POWERON') return;                    // 얼마나 꺼져 있었는지 모른다
    var base=m._lastep+1000;                            // 재부팅 약 1초로 본다
    g.forEach(function(r){ r.epoch=base+r.t_open; r._est=true });
  });
}

// ── 통계 유틸 ───────────────────────────────────────────────
function num(a){return a.filter(function(x){return typeof x==='number'&&isFinite(x)})}
function med(a){a=num(a).slice().sort(function(x,y){return x-y});return a.length?(a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2):null}
function pct(a,p){a=num(a).slice().sort(function(x,y){return x-y});if(!a.length)return null;
  var i=(a.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i);
  return lo===hi?a[lo]:a[lo]+(a[hi]-a[lo])*(i-lo)}
function mean(a){a=num(a);return a.length?a.reduce(function(s,x){return s+x},0)/a.length:null}
function s(x,d){return x===null||x===undefined?'—':(d?x.toFixed(d):Math.round(x)).toLocaleString()}
function sec(ms){return ms===null?'—':(ms/1000).toFixed(1)+'s'}

// ── 렌더 ────────────────────────────────────────────────────
function render(){
  var R=D.rows; document.getElementById('out').classList.remove('hide');
  var open=R.map(function(r){return r.open_ms});
  var th=R.length?R[R.length-1]._th:0;

  // ── 품질 플래그 ─────────────────────────────────────────
  var F=[], nFault=R.filter(function(r){return r.fault&&r.fault!=='OK'}).length;
  var nDip  =R.filter(function(r){return r.n_dip>0}).length;
  var nDeep =R.filter(function(r){return th&&r.d_omin!==null&&r.d_omin<th}).length;
  var nLost =R.filter(function(r){return r.n_lost>0}).length;
  var boots =Array.from(new Set(R.map(function(r){return r._boot}))).length;
  var noEpoch=R.filter(function(r){return !r.epoch}).length;

  if(R.length<30) F.push(['warn','표본이 '+R.length+'건이다. 30건 미만이면 분포·평균을 신뢰하지 말 것. 경향만 본다.']);
  if(nFault)   F.push(['bad', 'fault≠OK 인 정차 '+nFault+'건. 그 구간 데이터는 빼고 분석해야 한다.']);
  if(nDeep)    F.push(['bad', '개방 중 최솟값이 임계값보다 낮은 정차 '+nDeep+'건 — 문틀 스침 의심 (기준 ⑤).']);
  else if(th)  F.push(['ok',  '모든 정차에서 개방 중 최솟값 > 임계값. 문틀 스침 없음.']);
  if(nDip)     F.push(['warn','n_dip>0 인 정차 '+nDip+'건. 개방 중 임계값 아래로 튄 샘플이 있다.']);
  if(nLost)    F.push(['warn','닫힘 구간 에코 손실이 있는 정차 '+nLost+'건 — 근거리 측정이 불안정해지고 있다.']);
  if(boots>1)  F.push(['warn','부팅 '+boots+'회. 리셋 구간에서 t_open 이 0 으로 돌아가므로 boot 별로 나눠 본다.']);
  var nEst=R.filter(function(r){return r._est}).length;
  if(nEst)     F.push(['warn','시각을 복원한 정차 '+nEst+'건 — 리셋 구간이라 추정치다(±수초). 표에 ~ 로 표시된다.']);
  if(noEpoch)  F.push(['warn','절대 시각이 없는 정차 '+noEpoch+'건 — 폰이 붙기 전이거나 전원이 끊긴 구간. 시간대별에서 제외된다.']);
  document.getElementById('flags').innerHTML=F.map(function(f){
    return '<div class="flag f-'+f[0]+'">'+(f[0]==='bad'?'🔴 ':f[0]==='warn'?'⚠️ ':'✅ ')+f[1]+'</div>'}).join('');

  // ── 측정 조건 ───────────────────────────────────────────
  var last=R.length?R[R.length-1]:{};
  document.getElementById('cond').innerHTML=
    '<tr><th>항목</th><th>값</th><th>뜻</th></tr>'
    +row2('임계값 th',s(last._th)+' mm','이보다 짧으면 CLOSED')
    +row2('유예 grace',s(last._grace)+' ms','닫힘 확정 후 이 안에 열리면 재개방으로 병합')
    +row2('디바운스 deb',s(last._deb),'연속 N회 같아야 상태 확정')
    +row2('부팅 횟수',boots,'리셋 구간 분리 기준')
    +row2('표본',R.length+' 건','필터 없음 (전체)');

  // ── KPI ────────────────────────────────────────────────
  var reopenRate=R.length?R.filter(function(r){return r.reopen>0}).length/R.length*100:null;
  document.getElementById('kpi').innerHTML=
     kpi(sec(med(open)),'개방 시간 중앙값','평균 '+sec(mean(open)))
    +kpi(sec(pct(open,0.25))+' ~ '+sec(pct(open,0.75)),'사분위 범위','흩어짐의 폭')
    +kpi(sec(Math.max.apply(null,num(open))),'최장 개방','제일 오래 열려 있던 정차')
    +kpi(R.length,'정차 수','n')
    +kpi(s(reopenRate,1)+'%','재개방 비율','정차 중 재개방이 있던 비율')
    +kpi(sec(med(R.map(function(r){return r.gap_ms}).filter(function(x){return x>0}))),'정차 간격 중앙값','층간 이동 시간');

  // ── 히스토그램 ─────────────────────────────────────────
  document.getElementById('hist').innerHTML=hist(num(open));
  document.getElementById('histnote').textContent=
    '가로축 = 개방 시간(초). 표본 '+num(open).length+'건. '
    +'A/B 비교가 들어오면 두 색으로 겹쳐 그린다.';

  // ── 효과 분석 ──────────────────────────────────────────
  document.getElementById('effect').innerHTML=effectPanel(R);

  // ── 시간대별 ───────────────────────────────────────────
  var withEp=R.filter(function(r){return r.epoch});
  if(!withEp.length){
    document.getElementById('byhour').innerHTML=
      '<div class=mut>절대 시각(epoch)이 없어 시간대별 분석을 못 한다.<br>'
      +'현장에서 폰을 한 번 접속시키면 보드에 시각이 주입되고 그 뒤 기록부터 채워진다.</div>';
  }else{
    var H={}; withEp.forEach(function(r){
      var h=new Date(r.epoch).getHours(); (H[h]=H[h]||[]).push(r.open_ms)});
    var ks=Object.keys(H).sort(function(a,b){return a-b});
    document.getElementById('byhour').innerHTML='<table><tr><th>시간대</th><th>정차</th><th>개방 중앙값</th><th>재개방률</th></tr>'
      +ks.map(function(h){return '<tr><td>'+h+'시</td><td>'+H[h].length+'</td><td>'+sec(med(H[h]))+'</td><td>—</td></tr>'}).join('')
      +'</table>';
  }

  // ── 품질 표 ────────────────────────────────────────────
  document.getElementById('qual').innerHTML=
    '<tr><th>항목</th><th>건수</th><th>판단</th></tr>'
    +row3('fault ≠ OK',nFault,nFault?'제외 후 분석':'정상')
    +row3('개방중 최솟값 < th',nDeep,nDeep?'문틀 스침 의심 — 센서 위치 재검토':'문틀 스침 없음')
    +row3('n_dip > 0',nDip,nDip?'순간 가림 있음':'없음')
    +row3('n_lost > 0',nLost,nLost?'근거리 에코 손실 — 센서 열화 감시':'없음')
    +row3('epoch 없음',noEpoch,noEpoch?'시간대별에서 제외':'전부 있음');

  // ── 정차 목록 ──────────────────────────────────────────
  var cols=['stop','epoch','open_ms','gap_ms','reopen','d_cmed','d_omin','n_dip','n_lost','fault'];
  document.getElementById('rows').innerHTML=
    '<tr>'+cols.map(function(c){return '<th>'+c+'</th>'}).join('')+'</tr>'
    +R.map(function(r){return '<tr>'+cols.map(function(c){
        var v=r[c];
        if(c==='epoch') v = v ? (r._est?'~ ':'')+new Date(v).toLocaleString('ko-KR') : '—';
        else if(v===null||v===undefined) v='—';
        var cls = (c==='d_omin'&&th&&r.d_omin<th)?' class=bad'
                : (c==='fault'&&v!=='OK'&&v!=='—')?' class=bad'
                : ((c==='n_dip'||c==='n_lost')&&v>0)?' class=warn':'';
        return '<td'+cls+'>'+v+'</td>'}).join('')+'</tr>'}).join('');
}

// ── 효과 분석 ───────────────────────────────────────────────
//
// 이 장치는 "사람이 없을 때만" 누른다. 사람이 있던 정차에는 아무 영향이 없다.
// 그런데 그 정차들이 분산을 지배한다 — 28.7초짜리 하나가 우리 효과 2초를 잡음에 묻는다.
//
// 그래서 두 가지를 나눠 본다:
//   무방해 군집  = 아무도 방해하지 않아 엘리베이터 자체 타이머로만 닫힌 정차
//                 → 우리 장치가 실제로 공략하는 대상
//   방해 정차    = 사람이 타고내리거나 문을 잡고 있던 정차
//                 → 우리 장치는 여기 손대지 않는다. 손대면 안 된다.
function baseline(open){
  // 하위쪽에 뭉친 군집을 찾는다. 정렬 후 인접 간격이 크게 벌어지는 곳에서 자른다.
  var a=num(open).slice().sort(function(x,y){return x-y});
  if(a.length<4)return {lo:a,hi:[],cut:null};
  var m=med(a), cut=a.length;
  for(var i=1;i<a.length;i++){
    // 중앙값의 1.5배를 넘고, 직전 값보다 30% 이상 튀면 거기부터 방해 정차로 본다
    if(a[i]>m*1.5 && a[i]>a[i-1]*1.3){cut=i;break}
  }
  return {lo:a.slice(0,cut), hi:a.slice(cut), cut:cut<a.length?a[cut]:null};
}
function sd(a){a=num(a);if(a.length<2)return null;var mu=mean(a);
  return Math.sqrt(a.reduce(function(s,x){return s+(x-mu)*(x-mu)},0)/(a.length-1))}
// 두 군 평균차 d 를 유의수준 5%·검정력 80% 로 잡는 데 필요한 군당 표본
function needN(sdv,d){ if(!sdv||!d)return null; return Math.ceil(2*Math.pow(1.96+0.84,2)*Math.pow(sdv/d,2)) }

function effectPanel(R){
  var hasMode = R.some(function(r){return r.mode==='A'||r.mode==='B'});
  var B=baseline(R.map(function(r){return r.open_ms}));
  var bs=sd(B.lo), bm=med(B.lo);

  var h='';
  h+='<table><tr><th>구분</th><th>정차</th><th>개방 중앙값</th><th>산포(σ)</th><th>뜻</th></tr>'
   + '<tr><td>무방해 군집</td><td>'+B.lo.length+'</td><td>'+sec(bm)+'</td><td>'+sec(bs)
   + '</td><td class=mut style=text-align:left>엘리베이터 자체 타이머. <b>우리가 공략하는 대상</b></td></tr>'
   + '<tr><td>방해 정차</td><td>'+B.hi.length+'</td><td>'+sec(med(B.hi))+'</td><td>'+sec(sd(B.hi))
   + '</td><td class=mut style=text-align:left>사람이 있던 정차. 손대지 않는다</td></tr>'
   + '<tr><td>전체</td><td>'+R.length+'</td><td>'+sec(med(R.map(function(r){return r.open_ms})))
   + '</td><td>'+sec(sd(R.map(function(r){return r.open_ms})))
   + '</td><td class=mut style=text-align:left>여기서 비교하면 효과가 잡음에 묻힌다</td></tr></table>';

  if(!hasMode){
    var all=sd(R.map(function(r){return r.open_ms}));
    var rows=[[2000,'2초'],[1500,'1.5초'],[1000,'1초']].map(function(d){
      return '<tr><td>'+d[1]+'</td><td>'+s(needN(all,d[0]))+'</td><td>'+s(needN(bs,d[0]))+'</td></tr>'}).join('');
    h+='<div class="flag f-warn" style="margin-top:12px">⚠️ <b>아직 효과를 잴 수 없다.</b> '
     + '이 데이터는 전부 대조군(장치 미작동)이다. <code>mode</code> 컬럼(A/B)이 들어오면 여기서 차이를 계산한다.</div>'
     + '<div class=mut style="margin:8px 0 4px">지금 산포로 계산한 <b>필요 표본</b> (유의수준 5%, 검정력 80%, 군당):</div>'
     + '<table><tr><th>잡고 싶은 차이</th><th>전체 정차로 비교</th><th>무방해 정차만 비교</th></tr>'+rows+'</table>'
     + '<div class=mut style="margin-top:8px">'
     + '<b>이 표가 이 대시보드에서 제일 중요하다.</b> 같은 효과인데 비교 대상을 좁히는 것만으로 '
     + '필요 표본이 수십 배 줄어든다. 그러려면 <b>A모드에서도 판정을 돌려 "눌렀을 것인가"를 기록</b>해야 한다 — '
     + '안 그러면 대조군에서 어느 정차가 비교 대상인지 알 방법이 없다.</div>';
    return h;
  }

  // A/B 가 있을 때 — 실제 효과 계산
  function grp(m,f){return R.filter(function(r){return r.mode===m&&(!f||r.would_press==1||r.pressed==1)})
                            .map(function(r){return r.open_ms})}
  var out='';
  [['전체 정차',false],['눌렀을 조건인 정차만',true]].forEach(function(g){
    var A=grp('A',g[1]), Bm=grp('B',g[1]);
    var d=(med(A)!==null&&med(Bm)!==null)?med(A)-med(Bm):null;
    var pooled=(sd(A)&&sd(Bm))?Math.sqrt((sd(A)*sd(A)+sd(Bm)*sd(Bm))/2):null;
    var enough=pooled&&d?(Math.min(A.length,Bm.length)>=needN(pooled,Math.abs(d))):false;
    out+='<tr><td>'+g[0]+'</td><td>'+A.length+' / '+Bm.length+'</td><td>'+sec(med(A))+'</td><td>'+sec(med(Bm))
       + '</td><td'+(d>0?' class=ok':'')+'>'+(d===null?'—':sec(d))+'</td><td>'
       + (d===null?'—':(enough?'<span class=ok>표본 충분</span>':'<span class=warn>표본 부족 ('
         +s(needN(pooled,Math.abs(d)))+'건 필요)</span>'))+'</td></tr>';
  });
  h+='<h3 style="font-size:14px;margin:14px 0 6px">A/B 비교</h3><table>'
   + '<tr><th>비교 대상</th><th>A / B 건수</th><th>A 중앙값</th><th>B 중앙값</th><th>차이</th><th>판정</th></tr>'
   + out+'</table>'
   + '<div class=mut style="margin-top:8px">차이 = A(안 누름) − B(누름). 양수면 우리 장치가 개방시간을 줄인 것이다.<br>'
   + '<b>아래 줄(눌렀을 조건인 정차만)이 진짜 효과다.</b> 위 줄은 손대지 않은 정차까지 섞여 희석돼 있다.</div>';
  return h;
}

function kpi(v,l,n){return '<div class=kpi><div class=v>'+v+'</div><div class=l>'+l+'</div><div class=n>'+(n||'')+'</div></div>'}
function row2(a,b,c){return '<tr><td>'+a+'</td><td>'+b+'</td><td class=mut style=text-align:left>'+c+'</td></tr>'}
function row3(a,b,c){return '<tr><td>'+a+'</td><td'+(b?' class=warn':'')+'>'+b+'</td><td class=mut style=text-align:left>'+c+'</td></tr>'}

// 히스토그램 (인라인 SVG, 외부 라이브러리 없음)
function hist(a){
  if(!a.length)return '<div class=mut>데이터 없음</div>';
  var W=760,H=200,P=34, mx=Math.max.apply(null,a)/1000, nb=Math.min(14,Math.max(5,Math.ceil(Math.sqrt(a.length))));
  var bw=mx/nb, B=new Array(nb).fill(0);
  a.forEach(function(x){var i=Math.min(nb-1,Math.floor(x/1000/bw));B[i]++});
  var top=Math.max.apply(null,B), bars='';
  for(var i=0;i<nb;i++){
    var h=B[i]/top*(H-P-18), x=P+i*(W-P-8)/nb, w=(W-P-8)/nb-3;
    bars+='<rect x="'+x+'" y="'+(H-P-h)+'" width="'+w+'" height="'+h+'" fill="#58a6ff" rx="2"/>';
    if(B[i])bars+='<text x="'+(x+w/2)+'" y="'+(H-P-h-4)+'" fill="#8b949e" font-size="10" text-anchor="middle">'+B[i]+'</text>';
    bars+='<text x="'+(x+w/2)+'" y="'+(H-P+13)+'" fill="#8b949e" font-size="10" text-anchor="middle">'+(i*bw).toFixed(0)+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" role=img aria-label="개방 시간 히스토그램">'
    +'<line x1="'+P+'" y1="'+(H-P)+'" x2="'+(W-8)+'" y2="'+(H-P)+'" stroke="#262d36"/>'+bars+'</svg>';
}
</script>
